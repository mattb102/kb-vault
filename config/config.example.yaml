# Copy this to config/config.yaml and edit. Non-secret preferences only —
# secrets (API_KEY, AUTH_PASSWORD, OPENAI_API_KEY) live in .env, written by
# the bootstrap scripts. Environment variables override anything set here.

# Absolute path to your vault (the folder of markdown notes). Required.
# The bootstrap scripts set this for you.
vaultPath: /home/you/vault

# Your name, used to address you in tool output. Set during personalization.
ownerName: "the user"

# Shown on the sign-in screen and as the MCP server name.
serverName: "vault"

# "stdio" for local Claude Code, "http" for the VPS deployment.
# The bootstrap scripts set this per surface.
transport: stdio
port: 3000

# Embeddings backend (powers semantic search):
#   local   -> quantized ONNX model on the box. No API key, no account, no cost.
#              The default. Wants a 4GB x86 box (the cheapest Hetzner CX22 is fine).
#   openai  -> hosted API. Opt-in. Runs on an even tinier box and indexes faster,
#              but needs an OpenAI account + OPENAI_API_KEY (a few pennies/month).
embeddingProvider: local
# embeddingModel: nomic-ai/nomic-embed-text-v1.5   # (local default)
# embeddingModel: text-embedding-3-small           # (openai default)

# Opt-in feature plugins. A fresh install enables none. Personalization
# (setup chunk 08) edits this list. Available plugins live in src/plugins/:
#   running   - worked example: log runs + aggregate stats (write-back)
#   calendar  - worked example: Google Calendar (needs Google OAuth)
#   mal       - reference: MyAnimeList anime/manga tracking
#   espn      - reference: ESPN fantasy baseball (read-only API)
#   claude_code - powerful: delegate coding tasks to Claude Code on the VPS
#   ios_app     - phone home-screen app: tap-to-log trackers + push notifications
#   morning_report - a daily briefing the vault writes about you
enabledPlugins: []

# Per-plugin settings. Only the plugins you enable above read their section.
plugins:
  # The phone app. Install it by opening https://<your-domain>/app on your
  # phone and adding it to the home screen — on iPhone that step is what makes
  # notifications possible at all.
  #
  # Each tracker is one tap-to-log button set backed by one note in your vault.
  #   kind: scale  -> one button per step from min to max (max 21 buttons)
  #   kind: yesno  -> a Yes/No pair, stored as 1/0
  #   kind: number -> a free numeric field (use `unit` for the placeholder)
  ios_app:
    title: "My Vault"
    trackers: []
    # Push rate-limiting — shared by nudge-push, evening-nudges, and the
    # send_phone_notification MCP tool. All sends are logged to data/push-ledger.json.
    push:
      dailyCap: 3          # max distinct topics pushed per Eastern day (0 = no cap)
      minGapMinutes: 60    # min minutes between any two automated pushes
      noRepeatDays: 14     # days before the same topic can push again
      startHour: 9         # earliest Eastern hour for automated pushes (nudge-push)
      endHour: 21          # latest Eastern hour for automated pushes (nudge-push)
    #  - id: mood
    #    label: "Mood"
    #    prompt: "How's today going?"
    #    kind: scale
    #    min: 1
    #    max: 10
    #    note: Health/metrics/mood.md
    #  - id: sleep
    #    label: "Sleep"
    #    kind: number
    #    unit: hrs
    #    note: Health/metrics/sleep.md

  # The daily briefing. Always written to Reports/<date>-morning.md in your
  # vault; `delivery` adds channels on top of that.
  #   push    -> a notification to the phone app (needs the ios_app plugin)
  #   discord -> posted to DISCORD_WEBHOOK_URL
  morning_report:
    delivery: []
    # audio: true                 # read it aloud as an mp3 (Discord; needs OPENAI_API_KEY)
    # tone: "blunt, no pep talk"
    # location: "Boston"          # omit to skip the weather line
    # trackers: [mood, sleep]     # tracker ids to summarize

# Retention / decay settings for the automated cleanup scripts.
# These are read by scripts/nudge-decay.ts and scripts/decay-scratchpad.ts.
# The bootstrap-vps.sh installs the corresponding crons when ANTHROPIC_API_KEY is set.
decay:
  # Days a P2/P3 open nudge must go untouched before nudge-decay.ts expires it.
  # P0/P1 nudges are never auto-expired — a stale high-priority nudge is a signal.
  nudgeDecayDays: 60
  # Days before a scratchpad entry is moved from the live file to the monthly
  # archive. Archived entries are still searchable via get_observations with
  # include_archive=true. The live file is a rolling window of this size.
  scratchpadDecayDays: 120

# ─── Write checklist (optional) ────────────────────────────────────────────
# Vault-relative path to a short checklist of write rules. When present it is
# prepended to every get_identity response and to the MCP server instructions,
# so Claude reads the rules before every write operation in the session.
# Copy config/write-checklist.example.md into your vault as a starting point:
#   cp config/write-checklist.example.md $VAULT_PATH/Core/write-checklist.md
# checklistFile: Core/write-checklist.md    # default — omit to use this path

# ─── Nightly reconcile (requires claude CLI, off by default) ───────────────
# Reads yesterday's scratchpad observations, asks Claude which canonical files
# they affect, proposes guarded rewrites, and logs every change with its diff
# to AI-Observations/reconcile/<date>.md. The morning report surfaces what changed.
#
# Requires: `claude` CLI on PATH with subscription auth (CLAUDE_CODE_OAUTH_TOKEN
# or stored credentials in ~/.claude). Does NOT use ANTHROPIC_API_KEY.
# Install the cron: bootstrap-vps.sh adds it when reconcile.enabled is true.
reconcile:
  enabled: false            # set to true to activate the nightly cron
  days: 1                   # how many days of observations to read each run
  # maxFilesPerRun: 8       # cap on files rewritten per run (default 8)
  # routingFile: Core/routing.md  # vault-relative path to your routing manifest

# ─── Monthly audit (requires claude CLI, off by default) ───────────────────
# On the 1st of each month, reads every auditable top-level folder and asks
# Claude for per-file verdicts (KEEP / CLEAN / MERGE / DELETE). Read-only —
# nothing is applied. Report goes to AI-Observations/audits/<date>.md and the
# morning report links it.
#
# Requires: `claude` CLI on PATH with subscription auth (same as reconcile).
audit:
  enabled: false            # set to true to activate the monthly cron
  # groups:                 # optional: explicit list of top-level folders to audit
  #   - Core               # if omitted, all non-excluded folders are auto-discovered
  #   - Work
  #   - Health
